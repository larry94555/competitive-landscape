[package]
name = "landscape-api"
description = "HTTP surface: axum routers, request validation, error mapping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Internal to this workspace; never goes to crates.io.
publish = false

[dependencies]
landscape-core.workspace = true
landscape-db.workspace = true

async-stream.workspace = true
axum.workspace = true
futures-util.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
# For `task_local!`, which carries the request id to the error path without putting a
# parameter on every handler signature.
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# The interrupted-run tests drive the SSE handler and mutate the store underneath it,
# so they need a runtime as well as the router.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
