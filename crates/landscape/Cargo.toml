landscape-discover.workspace = true
landscape-extract.workspace = true
landscape-llm.workspace = true
landscape-fetch.workspace = true
landscape-search.workspace = true

anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
