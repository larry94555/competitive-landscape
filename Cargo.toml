[workspace]
resolver = "2"
members = [
    "crates/landscape-core",
    "crates/landscape-db",
    "crates/landscape-api",
    "crates/landscape",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/larry94555/competitive-landscape"

[workspace.dependencies]
landscape-core = { path = "crates/landscape-core" }
landscape-db = { path = "crates/landscape-db" }
landscape-api = { path = "crates/landscape-api" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# CODING_QUALITY.md: the toolchain is in place from the first commit, not retrofitted.
# These are workspace-wide so a new crate inherits them by writing `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# A panic in a request handler takes down work that a user is waiting on. These are
# denied rather than warned so CI fails on them instead of accumulating them.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
# Correctness of money, time and rounding matters more here than most places.
float_cmp = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
