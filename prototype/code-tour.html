<style>
  :root{--ground:#0D1311;--surface:#131C19;--ink:#E8EFEB;--ink-soft:#B8C5BF;--muted:#7F8F88;
    --rule:#233029;--accent:#4FBFA3;--accent-soft:#12302A;--warn:#D9A441;--flag:#E0765B;

    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.55}

  .banner{background:var(--accent-soft);color:var(--accent);font-family:var(--mono);
    font-size:.78rem;letter-spacing:.04em;padding:.5rem 1rem;text-align:center;
    border-bottom:1px solid var(--rule)}

  .wrap{display:grid;grid-template-columns:19rem 1fr;min-height:calc(100vh - 2.4rem)}

  .tree{border-right:1px solid var(--rule);padding:1.2rem 1rem;font-family:var(--mono);font-size:.8rem}
  .tree h2{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    margin:0 0 .9rem;font-weight:600}
  .tree .row{padding:.28rem .5rem;border-radius:3px;color:var(--ink-soft);white-space:nowrap}
  .tree .row.dir{color:var(--muted)}
  .tree .row .note{color:var(--muted);font-size:.72rem}

  .pane{padding:1.4rem 1.6rem;overflow:hidden}
  .filename{font-family:var(--mono);font-size:.82rem;color:var(--accent);margin-bottom:.15rem}
  .purpose{font-size:.86rem;color:var(--muted);margin-bottom:1rem;max-width:70ch}

  pre{margin:0;font-family:var(--mono);font-size:.84rem;line-height:1.62;
    background:var(--surface);border:1px solid var(--rule);border-radius:4px;
    padding:1rem 1.1rem;overflow:hidden;white-space:pre}
  .ln{display:block;padding:0 .35rem;border-radius:2px}
  .k{color:#7FD6BF}.s{color:var(--warn)}.c{color:var(--muted);font-style:italic}
  .t{color:#9DC6F0}.f{color:#E8EFEB}

  /* Same highlight mechanism as the product films: a class on the element, so it is
     correct by construction rather than measured against a moving page. */
  .spotted{outline:2px solid var(--accent)!important;outline-offset:3px;border-radius:3px;
    background:rgba(79,191,163,.13)!important}

  .cap-bar{position:fixed;left:0;right:0;bottom:0;background:rgba(6,10,9,.94);
    border-top:1px solid var(--rule);padding:.85rem 1.2rem;display:none}
  .cap-bar.on{display:block}
  .cap-text{font-size:1.02rem;max-width:80ch;margin:0 auto;text-align:center}
</style>

  function show(key) {
    var f = FILES[key];
    if (!f) return;
    $("fname").textContent = f.name;
    $("purpose").textContent = f.purpose;
    var html = "";
    for (var i = 0; i < f.lines.length; i++) {
      html += '<span class="ln ' + f.lines[i][0] + '">' + esc(f.lines[i][1]) + "</span>";
    }
    $("code").innerHTML = html;
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var spotted = null;
  function spot(sel) {
    clearSpot();
    var el = document.querySelector(sel);
    if (!el) return;
    spotted = el;
    el.classList.add("spotted");
  }
  function clearSpot() {
    if (spotted) { spotted.classList.remove("spotted"); spotted = null; }
  }

  function act(spec) {
    if (!spec || spec === "hold") return;
    var c = spec.indexOf(":"), verb = c < 0 ? spec : spec.slice(0, c);
    var arg = c < 0 ? "" : spec.slice(c + 1);
    if (verb !== "spot") clearSpot();
    if (verb === "file") show(arg);
    else if (verb === "spot") spot(arg);
  }

  // exist only so the page previews at the right speed, and must be changed with it.
  var t = 0;
  BEATS.forEach(function (b) {
    var d = (b.kind === "result" || b.kind === "means") ? 3.8 : 2.6;
    if (/\d/.test(b.c)) d = Math.max(d, 3.8);
    d = Math.max(d, b.c.length / 14 + 0.6);
    if (b.a.indexOf("spot:") === 0 || b.a.indexOf("file:") === 0) d += 1.3;
    b.t = Math.round(t * 10) / 10;
    b.d = Math.round(d * 10) / 10;
    t += b.d;
  });
  var TOTAL = Math.round(t * 10) / 10;

  var timers = [];
  function playDemo() {
    timers.forEach(clearTimeout); timers = [];
    clearSpot();
    $("capBar").classList.add("on");
    show("problem");
    BEATS.forEach(function (b) {
      timers.push(setTimeout(function () {
        try { act(b.a); } catch (e) {}
        $("capText").textContent = b.c;
      }, b.t * 1000));
    });
    timers.push(setTimeout(function () {
      clearSpot();
      $("capText").textContent = "The full source is in the pull request.";
    }, TOTAL * 1000));
  }

  show("problem");

  // The same two globals the product prototype exposes, so record-demo.mjs and build.py
  // work against this page unchanged.
  window.__playDemo = playDemo;
  window.__chapters = [{
    id: "code", n: 1,
    title: "Is the model right?",
    blurb: "A model that passed every check we had was returning nonsense. This adds the check that catches it: ten real pages with answers written by hand, the two bugs found on the way in, and one tidy idea that measured worse and was dropped.",
    seconds: TOTAL + 3
  }];
  window.__beats = BEATS;
})();
</script>
