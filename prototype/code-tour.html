<title>Landscape — Code Tour</title>
<style>
  :root{--ground:#0D1311;--surface:#131C19;--ink:#E8EFEB;--ink-soft:#B8C5BF;--muted:#7F8F88;
    --rule:#233029;--accent:#4FBFA3;--accent-soft:#12302A;--warn:#D9A441;--flag:#E0765B;
    --mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.55}

  .banner{background:var(--accent-soft);color:var(--accent);font-family:var(--mono);
    font-size:.78rem;letter-spacing:.04em;padding:.5rem 1rem;text-align:center;
    border-bottom:1px solid var(--rule)}

  .wrap{display:grid;grid-template-columns:19rem 1fr;min-height:calc(100vh - 2.4rem)}

  .tree{border-right:1px solid var(--rule);padding:1.2rem 1rem;font-family:var(--mono);font-size:.8rem}
  .tree h2{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    margin:0 0 .9rem;font-weight:600}
  .tree .row{padding:.28rem .5rem;border-radius:3px;color:var(--ink-soft);white-space:nowrap}
  .tree .row.dir{color:var(--muted)}
  .tree .row .note{color:var(--muted);font-size:.72rem}

  .pane{padding:1.4rem 1.6rem;overflow:hidden}
  .filename{font-family:var(--mono);font-size:.82rem;color:var(--accent);margin-bottom:.15rem}
  .purpose{font-size:.86rem;color:var(--muted);margin-bottom:1rem;max-width:70ch}

  pre{margin:0;font-family:var(--mono);font-size:.84rem;line-height:1.62;
    background:var(--surface);border:1px solid var(--rule);border-radius:4px;
    padding:1rem 1.1rem;overflow:hidden;white-space:pre}
  .ln{display:block;padding:0 .35rem;border-radius:2px}
  .k{color:#7FD6BF}.s{color:var(--warn)}.c{color:var(--muted);font-style:italic}
  .t{color:#9DC6F0}.f{color:#E8EFEB}

  /* Same highlight mechanism as the product films: a class on the element, so it is
     correct by construction rather than measured against a moving page. */
  .spotted{outline:2px solid var(--accent)!important;outline-offset:3px;border-radius:3px;
    background:rgba(79,191,163,.13)!important}

  .cap-bar{position:fixed;left:0;right:0;bottom:0;background:rgba(6,10,9,.94);
    border-top:1px solid var(--rule);padding:.85rem 1.2rem;display:none}
  .cap-bar.on{display:block}
  .cap-text{font-size:1.02rem;max-width:80ch;margin:0 auto;text-align:center}
</style>

<div class="banner" id="banner">CODE TOUR — finding a failure</div>

<div class="wrap">
  <aside class="tree">
    <h2>Repository</h2>
    <div class="row dir" id="t-crates">crates/</div>
    <div class="row" id="t-core">&nbsp;&nbsp;landscape-core<span class="note"> types</span></div>
    <div class="row" id="t-db">&nbsp;&nbsp;landscape-db<span class="note"> storage</span></div>
    <div class="row" id="t-api">&nbsp;&nbsp;landscape-api<span class="note"> http</span></div>
    <div class="row" id="t-llm">&nbsp;&nbsp;landscape-llm<span class="note"> the model</span></div>
    <div class="row" id="t-bench">&nbsp;&nbsp;landscape-bench<span class="note"> how fast</span></div>
    <div class="row" id="t-golden">&nbsp;&nbsp;landscape-golden<span class="note"> whether it is right</span></div>
    <div class="row" id="t-bin">&nbsp;&nbsp;landscape<span class="note"> the binary</span></div>
    <div class="row dir" id="t-mig">migrations/</div>
    <div class="row dir" id="t-web">web/<span class="note"> react + ts</span></div>
    <div class="row dir" id="t-docs">docs/<span class="note"> the spec</span></div>
  </aside>

  <main class="pane">
    <div class="filename" id="fname">&nbsp;</div>
    <div class="purpose" id="purpose">&nbsp;</div>
    <pre id="code"></pre>
  </main>
</div>

<div class="cap-bar" id="capBar"><div class="cap-text" id="capText"></div></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  // Real excerpts from the committed code. Kept short: a tour that shows whole files
  // shows nothing, because nobody reads a screen of code while being talked at.
  var FILES = {
    silent: {
      name: "the problem",
      purpose: "Both of these were true. Nothing connected them.",
      lines: [
        ['c', '// What the reader was told:'],
        ['t', '{ "error": "Something went wrong at our end." }'],
        ['c', ''],
        ['c', '// What we wrote down:'],
        ['t', 'ERROR request failed detail="connection refused"'],
        ['c', ''],
        ['c', '// Someone writes in: "it broke this afternoon."'],
        ['s', '// Against a log holding every other request.'],
        ['f', '// The information existed. It was not addressable.']
      ]
    },
    reference: {
      name: "crates/landscape-api/src/error.rs",
      purpose: "Give the reader something to quote.",
      lines: [
        ['t', '{ "error": "Something went wrong at our end.",'],
        ['t', '  "remedy": "... quote 9f2c11ab7d04 and we can find'],
        ['t', '             exactly what happened.",'],
        ['t', '  "reference": "9f2c11ab7d04" }'],
        ['c', ''],
        ['c', '// The same twelve characters are on the log line,'],
        ['c', '// and on the x-request-id header.'],
        ['f', '// The cause itself is still never returned.']
      ]
    },
    forged: {
      name: "crates/landscape-api/src/request_id.rs",
      purpose: "An id from outside is checked before it is trusted.",
      lines: [
        ['c', '// A proxy in front of us can supply one.'],
        ['c', '// So can anybody else.'],
        ['s', 'x-request-id: aaa[newline]ERROR request failed'],
        ['c', ''],
        ['c', '// That newline writes a line of their choosing into'],
        ['c', '// our log. A convincing forged error.'],
        ['c', ''],
        ['k', 'fn accept(raw: &str) -> Option<RequestId>'],
        ['f', '    // hex, dashes, 64 max. An allow-list.'],
        ['f', '// A list of what to strip is never complete.']
      ]
    },
    invisible: {
      name: "crates/landscape/src/main.rs",
      purpose: "The ids were perfect. Nothing wrote them down.",
      lines: [
        ['s', '"landscape=info"'],
        ['c', '// Does NOT match landscape_api. A filter matches a'],
        ['c', '// name and its children; landscape_api is a sibling.'],
        ['c', ''],
        ['c', '// So every line from the API crate was discarded'],
        ['c', '// before it was ever written.'],
        ['c', ''],
        ['f', '// Every test passed. The feature did nothing.']
      ]
    },
    debuglevel: {
      name: "crates/landscape-api/src/routes.rs",
      purpose: "The second reason the log was empty.",
      lines: [
        ['c', '// The borrowed request logger writes at DEBUG.'],
        ['c', '// Our default level is INFO. So: nothing.'],
        ['c', ''],
        ['c', '// It writes its own line now, inside the span:'],
        ['t', 'INFO request{request_id=0b9a3289e49a}: handled'],
        ['t', '     method=GET path="/api/health" status=200'],
        ['c', ''],
        ['f', '// One span per request. Our level, our fields.']
      ]
    },
    tradeoff: {
      name: "docs/decisions/0005",
      purpose: "Why logs, and not a wall of dashboards.",
      lines: [
        ['f', '  24 GB machine'],
        ['f', '  --------------------------------------'],
        ['t', '  three models            ~17 GB'],
        ['t', '  database, api, worker     the rest'],
        ['s', '  metrics stack            2-4 GB   <- no room'],
        ['c', ''],
        ['c', '// A dashboard tells us the product is unwell.'],
        ['f', '// Nothing on it fixes the product.'],
        ['c', ''],
        ['c', '// Written down: we give up aggregate questions.']
      ]
    },
    links: {
      name: "scripts/check_links.py",
      purpose: "271 links. One was broken.",
      lines: [
        ['c', '// A dead file link fails loudly when clicked.'],
        ['c', '// A dead ANCHOR drops you at the top of a long page'],
        ['c', '// with no sign anything is wrong - so you decide the'],
        ['c', '// reference was vague rather than broken.'],
        ['c', ''],
        ['s', 'FACT_CHECKING.md:326 -> no such file: /methodology'],
        ['c', ''],
        ['f', '// A mockup button that had become a real link.']
      ]
    },
    tutorial: {
      name: "docs/TUTORIAL.md",
      purpose: "An hour, from a clone to changing the code.",
      lines: [
        ['f', '  1. Run it                  no database, no key'],
        ['f', '  2. Follow one request      browser to log line'],
        ['f', '  3. Why the report is empty on purpose'],
        ['t', '  4. Break something         watch a test catch it'],
        ['f', '  5. The two harnesses       fast, and correct'],
        ['c', ''],
        ['c', '// Both breakages were run. They do fail, and they'],
        ['f', '// say what the rule was for.']
      ]
    }
  };

  function show(key) {
    var f = FILES[key];
    if (!f) return;
    $("fname").textContent = f.name;
    $("purpose").textContent = f.purpose;
    var html = "";
    for (var i = 0; i < f.lines.length; i++) {
      html += '<span class="ln ' + f.lines[i][0] + '">' + esc(f.lines[i][1]) + "</span>";
    }
    $("code").innerHTML = html;
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var spotted = null;
  function spot(sel) {
    clearSpot();
    var el = document.querySelector(sel);
    if (!el) return;
    spotted = el;
    el.classList.add("spotted");
  }
  function clearSpot() {
    if (spotted) { spotted.classList.remove("spotted"); spotted = null; }
  }

  function act(spec) {
    if (!spec || spec === "hold") return;
    var c = spec.indexOf(":"), verb = c < 0 ? spec : spec.slice(0, c);
    var arg = c < 0 ? "" : spec.slice(c + 1);
    if (verb !== "spot") clearSpot();
    if (verb === "file") show(arg);
    else if (verb === "spot") spot(arg);
  }

  // Same beat shape as the product films: kind drives timing, action drives the picture.
  var BEATS = [
    { kind: "recognition", a: "file:silent",     c: "An error told you nothing you could look up." },
    { kind: "means",       a: "spot:#code",      c: "We logged the cause. You saw a shrug." },
    { kind: "means",       a: "hold",            c: "Both true. Nothing joined them." },

    { kind: "turn",        a: "file:reference",  c: "Now every failure hands you a reference." },
    { kind: "means",       a: "spot:#code",      c: "The same characters are on the log line." },
    { kind: "means",       a: "hold",            c: "The cause itself is still never returned." },

    { kind: "result",      a: "file:forged",     c: "An id from outside is checked first." },
    { kind: "means",       a: "spot:#code",      c: "A newline would let a caller write our log." },

    { kind: "result",      a: "file:invisible",  c: "Then it did nothing at all." },
    { kind: "means",       a: "spot:#code",      c: "Our own crate was filtered out of the log." },
    { kind: "means",       a: "hold",            c: "Every test passed. Only running it showed this." },

    { kind: "result",      a: "file:debuglevel", c: "A second reason the log was empty." },
    { kind: "means",       a: "spot:#code",      c: "It writes its own line now, one per request." },

    { kind: "result",      a: "file:tradeoff",   c: "Why logs, and not dashboards." },
    { kind: "means",       a: "spot:#code",      c: "Three models leave no room. They are the product." },

    { kind: "result",      a: "file:links",      c: "Every link in the docs now resolves." },
    { kind: "means",       a: "spot:#code",      c: "One of two hundred and seventy-one did not." },

    { kind: "result",      a: "file:tutorial",   c: "And an hour-long path in, for anyone new." },

    { kind: "close",       a: "hold",            c: "A reported fault is now one search." }
  ];

  // Timings use the same rules as the product films. `prototype/build.py` holds the
  // authoritative constants and writes the captions actually shipped with the film; these
  // exist only so the page previews at the right speed, and must be changed with it.
  var t = 0;
  BEATS.forEach(function (b) {
    var d = (b.kind === "result" || b.kind === "means") ? 2.7 : 1.8;
    if (/\d/.test(b.c)) d = Math.max(d, 2.7);
    d = Math.max(d, b.c.length / 14 + 0.45);
    if (b.a.indexOf("spot:") === 0 || b.a.indexOf("file:") === 0) d += 0.9;
    b.t = Math.round(t * 10) / 10;
    b.d = Math.round(d * 10) / 10;
    t += b.d;
  });
  var TOTAL = Math.round(t * 10) / 10;

  var timers = [];
  function playDemo() {
    timers.forEach(clearTimeout); timers = [];
    clearSpot();
    $("capBar").classList.add("on");
    show("silent");
    BEATS.forEach(function (b) {
      timers.push(setTimeout(function () {
        try { act(b.a); } catch (e) {}
        $("capText").textContent = b.c;
      }, b.t * 1000));
    });
    timers.push(setTimeout(function () {
      clearSpot();
      $("capText").textContent = "The full source is in the pull request.";
    }, TOTAL * 1000));
  }

  show("silent");

  // The same two globals the product prototype exposes, so record-demo.mjs and build.py
  // work against this page unchanged.
  window.__playDemo = playDemo;
  window.__chapters = [{
    id: "code", n: 1,
    title: "Finding a failure",
    blurb: "An error that told you nothing you could look up, and what it took to fix that: a reference on every failure, two bugs that only running it could find, and the reason this project logs rather than builds dashboards.",
    seconds: TOTAL + 3
  }];
  window.__beats = BEATS;
})();
</script>
