# Postgres, and SearXNG behind a profile. The application itself runs from cargo so a
# rebuild is seconds, not a container build — and `--store memory` skips the database
# entirely.
#
#   docker compose up -d db                       what every other command assumes
#   docker compose --profile search up -d searxng  only when you are searching
#
# SearXNG is behind a profile because nothing else needs it: `landscape search` prints its
# queries without an engine, and every other command never asks one. A service that starts
# by default is a service people pay for on every `up`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: landscape
      POSTGRES_PASSWORD: landscape
      POSTGRES_DB: landscape
    ports:
      - "5432:5432"
    volumes:
      - landscape-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Compose waits for this before reporting the service healthy, so `up -d db` followed
      # immediately by a migration does not race the server's first boot.
      test: ["CMD-SHELL", "pg_isready -U landscape -d landscape"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The search channel's first provider. Metasearch, self-hosted: no key, no quota, no
  # per-query cost, and no third party learning what strangers type into our box.
  #
  # `SEARXNG_SETTINGS_PATH` points at `deploy/searxng/settings.yml`, which is checked in for
  # one reason: SearXNG serves HTML by default and answers **403** for `format=json` until
  # an instance opts in, so an unconfigured container looks like a broken search rather than
  # an unfinished setup.
  searxng:
    image: searxng/searxng:latest
    profiles: ["search"]
    # **Comes back after a reboot.** Without this the container stays stopped once the host or
    # the Docker daemon restarts, and a deployed box quietly loses its search channel — every
    # description then produces the refusal that says nobody could be searched for, for ever.
    # `unless-stopped` rather than `always`, so `docker compose stop` on a laptop stays stopped.
    restart: unless-stopped
    ports:
      # **Loopback, not every interface.** `8888:8080` publishes on `0.0.0.0`, and this is a
      # service with no authentication in front of it. Nothing outside the box has any business
      # reaching it: the application talks to it over localhost, and `docs/GO_LIVE.md` promises
      # that nothing but 80 and 443 is exposed.
      #
      # 8888 rather than 8080: that is llama.cpp's, and this box is designed to run three
      # of those. The rest of the map is in `crates/landscape/src/main.rs`.
      - "127.0.0.1:8888:8080"
    environment:
      # What `landscape search` should be pointed at. Written here so the value in the
      # README and the value the container serves cannot drift apart.
      SEARXNG_BASE_URL: "http://localhost:8888/"
    volumes:
      - ./deploy/searxng:/etc/searxng:ro
    healthcheck:
      # Asks for the format the application actually uses. A container that is up and
      # serving HTML only is not a working search engine for our purposes, and a healthcheck
      # on `/` would call it healthy.
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null 'http://127.0.0.1:8080/search?q=test&format=json' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  landscape-pgdata:
